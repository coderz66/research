<!DOCTYPE html>
<!--
========================================================================
  美股强势股主线 · HTML 模板（template）
  ------------------------------------------------------------------
  来源：美股强势股主线3_260519.html 抽离的结构 + 样式
  调性：navy/amber masthead（参考 A股映射） + Fraunces/米色正文
  用法：复制本文件 → 重命名为 美股强势股主线N_YYMMDD.html → 替换 {{...}} 占位
  ------------------------------------------------------------------
  分档：5 档独立 P80 → 重映射到 4 档显示（260523 修正：单位 $B、阈值对齐 stock_meta 5 档 L3=$5-30B / L4+L5 合并 <$5B）
    L · 大盘   ≥ $100B          ← L1
    M · 中盘   $30-100B         ← L2
    S · 小盘   $5-30B           ← L3
    T · 微盘   <$5B             ← L4 + L5 合并
  ------------------------------------------------------------------
  10 条主线骨架（按本期实际重写）：
    01 · AI 算力·大盘半导体 + 代工 + 存储
    02 · AI 算力·中盘卖铲人
    03 · AI Cyber
    04 · AI Infra·二线云 + 网络硬件 + CPaaS
    05 · 算力托管·BTC 矿企转 AI/HPC
    06 · 数据中心电力 / 储能 / 燃料电池 / 光伏
    07 · 商业航天 / 国防科技
    08 · AI 软件 / SaaS / 数据平台
    09 · EMS / PCB / AI Server BOM
    10 · 其他·反转 / 工业 / 妖股 / 国防小盘
========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{REPORT_TITLE}} · {{YYYY-MM-DD}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Source+Sans+3:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Karla:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --paper:#FFFFFF; --ink:#0E2A47; --ink-soft:#36506F; --muted:#6B7B8C;
  --accent:#8B6F35; --accent-soft:#B89460; --rule:#D9D2C2; --rule-soft:#EDE8DB;
  --bull:#1F6B4A; --bear:#A8331F; --highlight:#FFF1B8; --hairline:#C9C0AC;
  --navy:#1B2635; --navy-light:#2D3D52; --amber:#B8870A; --amber-light:#D4A017;
  --serif:'Fraunces',Georgia,serif; --sans:'Source Sans 3',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding:0 56px 52px;max-width:1700px;margin:0 auto}  /* 260613 正文宽 1700 · compact 页脚 80→52 */
em{font-style:italic;color:var(--accent)}
.num{font-family:var(--mono);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}

/* ========== MASTHEAD (navy/amber、参考 A股映射_260516) ========== */
.masthead{background:var(--navy);color:#fff;padding:42px 60px 32px 60px;border-bottom:3px solid var(--amber);position:relative;overflow:hidden;width:100vw;margin-left:calc(-50vw + 50%);margin-bottom:24px}  /* 260613 compact padding 56·44→42·32 / margin-bottom 36→24 */
.masthead::after{content:'US MOMENTUM';position:absolute;bottom:-22px;right:-10px;font-family:'Cormorant Garamond',serif;font-size:150px;font-weight:700;font-style:italic;color:rgba(255,255,255,0.04);letter-spacing:-0.04em;pointer-events:none;white-space:nowrap}
.h-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--amber-light);text-transform:uppercase;font-weight:500;margin-bottom:16px}
.h-title{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:700;line-height:1.05;margin-bottom:18px;letter-spacing:-0.01em;color:#fff}
.h-title em{color:var(--amber-light);font-style:italic;font-weight:700}
.h-desc{font-size:14.5px;font-weight:300;color:rgba(255,255,255,0.6);max-width:1080px;line-height:1.55;margin-bottom:24px;font-family:'Karla',-apple-system,sans-serif}
.h-desc em{color:var(--amber-light);font-style:italic;font-weight:500}
.h-pills{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.05em;padding:5px 12px;border:1px solid rgba(212,160,23,0.4);color:rgba(255,255,255,0.85);border-radius:999px;background:rgba(255,255,255,0.03)}
.pill.bull{color:#6FD4A1;border-color:rgba(31,107,74,0.5)}
.pill.bear{color:#E89884;border-color:rgba(168,51,31,0.5)}

/* ========== SECTIONS ========== */
.sec{margin:30px 0 0}  /* 260613 compact · 章节间距 48→30 */
.sec-num{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:600;margin-bottom:4px}
.sec-title{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;color:var(--ink);letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:10px}  /* 260613 compact */
.sec-title em{font-weight:500;font-style:italic;color:var(--accent)}
.sec-sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:-4px;margin-bottom:10px;max-width:none}  /* 260613 compact 16→10 */

.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-weight:600}

p{margin-bottom:7px;color:var(--ink-soft);max-width:none}  /* 260613 compact 10→7 */
p strong{color:var(--ink);font-weight:600}

/* ========== DATA TABLE ========== */
table.dt{width:100%;border-collapse:collapse;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin:10px 0;font-size:12.5px;line-height:1.4}  /* 260613 compact margin 14→10 · lh 1.45→1.4 */
table.dt thead th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;text-align:left;padding:9px 10px;border-bottom:1px solid var(--ink);background:var(--bg);font-weight:600;white-space:nowrap}
table.dt thead th[data-type="num"],table.dt tbody td.num{text-align:center;font-family:var(--mono);font-feature-settings:"tnum" 1}
table.dt tbody td.num{font-size:11px}  /* 260613 涨跌幅数据格小一号 (12.5→11) */
table.dt tbody td{padding:4px 9px;border-bottom:1px solid var(--rule-soft);vertical-align:top}  /* 260613 compact 行高 7→4（~120 行影响最大） */
table.dt tbody tr:hover{background:var(--rule-soft)}
table.dt tbody td.tk{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:600;white-space:nowrap}
table.dt tbody td.name{font-weight:500;color:var(--ink);font-size:12px;line-height:1.3}
table.dt td.logic{font-size:12px;color:var(--ink-soft);line-height:1.4}
table.dt td.logic strong{color:var(--ink)}
/* 个股逻辑列默认（无 class）的 td 也用紧凑行距，避免漏 class 时行间过松 */
table.dt tbody tr td:last-child{line-height:1.4}
/* ki-note 内嵌段同步收紧行距（260523 user 反馈）*/
table.dt .ki-note{line-height:1.5}
/* 89 Industry Chain Signals 表行距紧凑（260523 user 反馈）*/
#signals-tbl tbody td{padding:5px 8px;line-height:1.35;font-size:11.5px}
#signals-tbl thead th{padding:7px 8px}
table.dt .pos{color:var(--bull);font-weight:600}
table.dt .neg{color:var(--bear);font-weight:600}
/* ===== 主线个股表 7 列固定列宽 · shell 单一真相源（260530 加）=====
   颜色/字体/卡片/渐变一向由 shell 锁定、fragment 继承不生成；列宽过去是 10 个
   theme fragment 各写 inline、是唯一能跑偏的视觉参数。现收口到这里：theme 的
   <th> 不再写 inline width，改列宽只动这一处即全主线生效。
   作用域 section[id^="theme-"] 仅命中 theme-02..11 个股表，不影响
   §2 Theme Map(#exec-summary) / §12 信号表 / §13 catalyst 表（单实例、保留 inline）。*/
section[id^="theme-"] table.dt th:nth-child(1){width:4%}    /* Ticker */
section[id^="theme-"] table.dt th:nth-child(2){width:6.3%}  /* 公司 */
section[id^="theme-"] table.dt th:nth-child(3){width:2.5%}  /* 1W · 260613 收窄 3→2.5 */
section[id^="theme-"] table.dt th:nth-child(4){width:2.5%}  /* 1M · 260613 收窄 */
section[id^="theme-"] table.dt th:nth-child(5){width:2.5%}  /* 3M · 260613 收窄 */
section[id^="theme-"] table.dt th:nth-child(6){width:4.9%}  /* 归因 */
section[id^="theme-"] table.dt th:nth-child(7){width:77.3%} /* 关键产业事实 + ki-note · 260613 吃下 +1.5% */
.hl{background:var(--highlight);padding:0 2px}

/* ========== ki-note (个股逻辑解读) ========== */
.ki-note{display:block;margin-top:5px;padding:6px 11px 5px;border-left:2px solid var(--accent-soft);background:#FBF8EF;font-family:var(--sans);font-style:normal;font-size:12.25px;font-weight:400;color:var(--ink);line-height:1.62;letter-spacing:.002em}  /* 260613 逻辑卡片上下间距收紧 margin8→5/padding8·7→6·5 */
.ki-note::before{content:"逻辑 · ";font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-right:2px}
.ki-note em{font-style:normal;font-weight:600;color:var(--ink);background:#FFF1B8;padding:0 3px;border-radius:2px}

/* ========== note-block (牛熊闸门 / 分层判断 / 出场信号) ========== */
.note-block{background:var(--rule-soft);border-left:3px solid var(--accent);padding:9px 14px;margin:10px 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}  /* 260613 compact padding 11→9 / margin 14→10 / lh 1.55→1.5 */
.note-block .kicker{display:block;margin-bottom:4px}
.note-block strong{color:var(--ink)}
#exec-summary .note-block{background:linear-gradient(90deg,#FFF8E0 0,#FFFFFF 35%);border-left-color:#B8870A;margin:9px 0}  /* 260613 §3 五大信号等 exec 卡片上下间距 14→9 收紧 */
/* §3「本周5个最重要信号·深度归因」卡片再 compact（260613 · :has(>.kicker) 精确命中含内层 kicker 的信号卡，不碰 §0.5 宏观块 / §1 take-away——它们的 kicker 在 note-block 外） */
#exec-summary .note-block:has(> .kicker){margin:6px 0;padding:7px 13px;line-height:1.45}
#exec-summary .note-block:has(> .kicker) > .kicker{margin-bottom:3px}
#exec-summary .note-block:has(> .kicker) > p{margin-bottom:0}
/* 牛熊闸门统一琥珀渐变（260530：所有 theme 的 Bull/Mixed/Bear Logic 闸门加 class="note-block gate"）*/
.note-block.gate{background:linear-gradient(90deg,#FFF8E0 0,#FFFFFF 35%);border-left-color:#B8870A}

/* ========== theme-card (主线标签卡) ========== */
.theme-card{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:14px 18px;margin:14px 0}
.theme-card.bull{border-left-color:var(--bull)}
.theme-card.bear{border-left-color:var(--bear)}
.theme-card.mixed{border-left-color:var(--accent-soft)}
.theme-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.theme-meta span.k{color:var(--accent);font-weight:700}
.theme-meta span.v{color:var(--ink);font-weight:600;margin-right:14px}

/* ========== Bull/Bear cards 并列 ========== */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}  /* 260613 compact gap 14→12 / margin 14→10 */
.card{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:14px 16px}
.card.bull{border-left-color:var(--bull)}
.card.bear{border-left-color:var(--bear)}
.card-title{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px}
.card-title em{color:var(--accent)}
.card-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.04em}
.card-body{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.card-body ol{font-size:11.5px;line-height:1.45}  /* 260613 Bull/Bear 卡片内容字体小一号 + 行距收紧（FOCUS/重要公司卡片用 <p> 不受影响） */
.card-body ol li{margin-bottom:3px}  /* 260613 段间距 5→3 */
.card-body strong{color:var(--ink)}
.card-body p{margin:0 0 7px}

/* ========== ★ FOCUS(#focus) + ★ 重要公司(#important) 卡片紧凑（260613 · 二次再 compact · scope 仅这两节、不影响主线 Bull-Bear） ========== */
#focus .cards,#important .cards{row-gap:8px}              /* 卡片上下间距 →8（列间距 12 由 .cards 全局 compact 提供） */
#focus .card,#important .card{padding:8px 14px}           /* 卡片内 padding →8·14 */
#focus .card-body,#important .card-body{line-height:1.42} /* 行间距 →1.42 */
#focus .card-body p,#important .card-body p{margin:0 0 3px}  /* 段间距 →3 */
#focus .card-meta,#important .card-meta{margin-bottom:5px}   /* meta 与正文间距 8→5 */

/* ========== 子链小标题 sub-h（★ 重要公司 二级深读 按子链分组用） ========== */
.sub-h{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);margin:24px 0 8px;letter-spacing:-.005em}
.sub-h em{font-style:italic;color:var(--accent)}

/* ========== 视图 tabs (4 档独立筛选) ========== */
.view-tabs{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:18px;display:flex;gap:8px;align-items:center}
.view-tabs .vlabel{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.view-tabs .vtab{font-family:var(--mono);font-size:11px;padding:6px 14px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft);cursor:pointer;letter-spacing:.04em;font-weight:600}
.view-tabs .vtab:hover{background:var(--rule-soft)}
.view-tabs .vtab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
body[data-view="large"] table.dt tbody tr:not([data-cap="L"]){display:none}
body[data-view="midsmall"] table.dt tbody tr:not([data-cap="M"]){display:none}
body[data-view="small"] table.dt tbody tr:not([data-cap="S"]){display:none}
body[data-view="micro"] table.dt tbody tr:not([data-cap="T"]){display:none}

/* ========== 归因 tag（表格"归因"列用，260516 引入） ========== */
table.dt .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:2px;letter-spacing:.04em;font-weight:500;white-space:nowrap;margin-right:3px}
.tag.t-er{background:#E8F0E5;color:var(--bull)}
.tag.t-cat{background:#FBF1D8;color:var(--accent)}
.tag.t-map-d{background:#F0E5DA;color:var(--accent)}
.tag.t-map-i{background:#F5EDDF;color:var(--accent-soft)}
.tag.t-map-s{background:#EDE8DB;color:var(--muted)}
.tag.t-none{background:#EAEAE5;color:var(--muted)}
.tag.t-er-miss{background:#F4DCD3;color:var(--bear)}
.tag.t-guide-cut{background:#F4DCD3;color:var(--bear)}
.tag.t-rot{background:#EDE8DB;color:var(--ink-soft)}

/* ========== Signal table 方向标记（Industry Chain Signals §) ========== */
.signal-up{color:var(--bull);font-weight:600;font-family:var(--mono);font-size:12px}
.signal-down{color:var(--bear);font-weight:600;font-family:var(--mono);font-size:12px}
.signal-flat{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:12px}

/* ========== Beta strip (本周板块 β 全景 · grid of small cards) ========== */
.beta-strip{margin:18px 0 8px;border:1px solid var(--rule);background:var(--paper);padding:14px 16px 12px}
.beta-strip .kicker{display:block;margin-bottom:10px}
.beta-strip .kicker em{color:var(--ink);font-style:normal;font-weight:600}
.beta-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;background:var(--rule)}
.beta-item{padding:7px 8px;background:var(--paper);display:flex;flex-direction:column;gap:2px;line-height:1.15;min-width:0}
.beta-item .bn{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.beta-item .bv{font-family:var(--mono);font-size:13px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.beta-item .bd{font-size:9.5px;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beta-item.up .bv{color:var(--bull)}
.beta-item.dn .bv{color:var(--bear)}
.beta-item.flat .bv{color:var(--muted)}
/* highlight: 重要的行业 β 数据用琥珀金外框 + 加粗强调 */
.beta-item.hl{background:#FFF8E0;outline:1.5px solid var(--accent);outline-offset:-1.5px;position:relative;z-index:1}
.beta-item.hl .bn{color:var(--ink)}
.beta-item.hl .bv{font-size:14px}
.beta-strip .footer{margin-top:10px;font-size:11px;color:var(--ink-soft);line-height:1.45}
.beta-strip .footer strong{color:var(--ink)}

/* ========== Theme Map strength bar ========== */
.theme-strength{display:inline-block;min-width:54px;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.04em}  /* 260613 修复：固定 width:54px 致「强·反向」「中弱·反向」等长标签在盒内换两行+bar 错位 → min-width+nowrap 永不换行 */
.theme-bar{display:inline-block;height:8px;background:var(--accent);vertical-align:middle;margin-right:6px}

/* ========== Sortable columns (click thead th[data-type] to sort tbody) ========== */
table.dt thead th[data-type]{cursor:pointer;user-select:none;position:relative;padding-right:18px}
table.dt thead th[data-type]:hover{color:var(--ink);background:var(--rule-soft)}
table.dt thead th[data-type]::after{content:"⇅";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--rule);opacity:.6}
table.dt thead th[data-sort-dir="asc"]::after{content:"▲";color:var(--accent);opacity:1}
table.dt thead th[data-sort-dir="desc"]::after{content:"▼";color:var(--accent);opacity:1}

/* ========== 左侧固定目录 TOC（260530 加 · JS 自动扫描 section[id] 生成） ========== */
html{scroll-behavior:smooth}
#toc-nav{position:fixed;top:0;left:0;bottom:0;width:212px;z-index:1000;background:var(--navy);
  border-right:3px solid var(--amber);overflow-y:auto;padding:54px 0 30px;
  font-family:var(--mono);-webkit-font-smoothing:antialiased}
#toc-nav::-webkit-scrollbar{width:6px}
#toc-nav::-webkit-scrollbar-thumb{background:rgba(212,160,23,.35);border-radius:3px}
#toc-nav .toc-head{position:relative;padding:4px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
#toc-nav .toc-head .t1{font-size:11px;letter-spacing:.2em;color:var(--amber-light);text-transform:uppercase;font-weight:600}
#toc-nav .toc-head .t2{font-size:9.5px;color:rgba(255,255,255,.42);margin-top:3px;letter-spacing:.05em}
#toc-nav a{display:flex;gap:8px;align-items:baseline;padding:6px 14px 6px 18px;text-decoration:none;
  border-left:2px solid transparent;line-height:1.3}
#toc-nav a .n{font-size:9.5px;color:var(--amber);font-weight:600;min-width:24px;letter-spacing:.02em;flex-shrink:0}
#toc-nav a .t{font-size:10.5px;color:rgba(255,255,255,.7);font-weight:500;letter-spacing:.01em}
#toc-nav a:hover{background:rgba(255,255,255,.05)}
#toc-nav a:hover .t{color:#fff}
#toc-nav a.active{background:rgba(184,135,10,.16);border-left-color:var(--amber)}
#toc-nav a.active .t{color:#fff;font-weight:600}
#toc-nav a.active .n{color:var(--amber-light)}
/* 正文整体右移让出目录宽度（仅 margin-left / masthead 宽度被覆盖，其余继承原样） */
body{margin-left:212px}
.masthead{width:calc(100vw - 212px);margin-left:-56px}
section[id]{scroll-margin-top:64px}
/* ---- 收起/展开 目录 ---- */
#toc-nav{transition:transform .26s ease}
body{transition:margin-left .26s ease}
.masthead{transition:width .26s ease,margin-left .26s ease}
#toc-collapse{position:absolute;top:-1px;right:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(212,160,23,.45);border-radius:5px;color:var(--amber-light);
  font-size:14px;line-height:1;cursor:pointer;user-select:none}
#toc-collapse:hover{background:rgba(184,135,10,.25);color:#fff}
body.toc-collapsed #toc-nav{transform:translateX(-100%)}
body.toc-collapsed{margin-left:auto}
body.toc-collapsed .masthead{width:100vw;margin-left:calc(-50vw + 50%)}
#toc-reopen{display:none;position:fixed;left:0;top:92px;z-index:1001;
  background:var(--navy);color:var(--amber-light);border:1px solid var(--amber);border-left:none;
  border-radius:0 8px 8px 0;padding:13px 6px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;writing-mode:vertical-rl;text-orientation:upright;
  box-shadow:2px 2px 10px rgba(0,0,0,.28)}
#toc-reopen:hover{background:var(--navy-light);color:#fff}
body.toc-collapsed #toc-reopen{display:block}
.toc-no-anim #toc-nav,.toc-no-anim.toc-collapsed,.toc-no-anim .masthead{transition:none!important}
/* 窄屏 / 打印：收起目录，正文复位 */
@media (max-width:980px){#toc-nav{display:none}#toc-reopen{display:none!important}body{margin-left:0}.masthead{width:100vw;margin-left:calc(-50vw + 50%)}}
@media print{#toc-nav{display:none}body{padding:24px;margin-left:0}.masthead{width:100vw;margin-left:calc(-50vw + 50%)}.view-tabs{display:none}}

<!-- ============================================================
     视图切换 JS（4 档独立筛选、点击 tab 切换 body[data-view]）
============================================================ -->
<script>
// 视图切换
document.querySelectorAll('.vtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.setAttribute('data-view', btn.dataset.view);
  });
});

// 表格列点击排序（所有 table.dt 通用、thead th[data-type] 触发）
document.querySelectorAll('table.dt').forEach(table => {
  const ths = table.querySelectorAll('thead th');
  ths.forEach((th, colIdx) => {
    if (!th.dataset.type) return;
    th.addEventListener('click', () => {
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const type = th.dataset.type;
      // 排序方向：已 asc → desc；已 desc → asc；首次点击：num 列默认 desc（大→小最常用）、text 列默认 asc
      let dir;
      if (th.dataset.sortDir === 'asc') dir = 'desc';
      else if (th.dataset.sortDir === 'desc') dir = 'asc';
      else dir = (type === 'num') ? 'desc' : 'asc';
      // 清掉同表其它列的箭头
      ths.forEach(o => { if (o !== th) delete o.dataset.sortDir; });
      th.dataset.sortDir = dir;
      rows.sort((a, b) => {
        const aCell = a.children[colIdx];
        const bCell = b.children[colIdx];
        const aText = (aCell ? aCell.textContent : '').trim();
        const bText = (bCell ? bCell.textContent : '').trim();
        let cmp;
        if (type === 'num') {
          const aNum = parseFloat(aText.replace(/[^\-0-9.]/g, ''));
          const bNum = parseFloat(bText.replace(/[^\-0-9.]/g, ''));
          const aV = isNaN(aNum) ? -Infinity : aNum;
          const bV = isNaN(bNum) ? -Infinity : bNum;
          cmp = aV - bV;
        } else {
          cmp = aText.localeCompare(bText, 'zh-CN');
        }
        return dir === 'asc' ? cmp : -cmp;
      });
      rows.forEach(r => tbody.appendChild(r));
    });
  });
});

// 左侧固定目录 TOC（自动扫描 section[id] 生成 + scroll-spy 高亮当前章节）
(function(){
  var secs = Array.prototype.slice.call(document.querySelectorAll('section[id]'));
  if(!secs.length) return;
  var nav = document.createElement('nav');
  nav.id = 'toc-nav';
  var head = document.createElement('div');
  head.className = 'toc-head';
  head.innerHTML = '<div class="t1">Contents<span id="toc-collapse" title="收起目录">&laquo;</span></div><div class="t2">本期主线导航</div>';
  nav.appendChild(head);
  // 特殊 section 的短标题映射（按 id）
  var TOC_OVERRIDE = {
    'exec-summary': 'Summary',
    'final-read': 'Final Read',
  };
  secs.forEach(function(sec){
    var numEl = sec.querySelector('.sec-num');
    var titEl = sec.querySelector('.sec-title');
    // 编号只取 §XX 部分（去掉 "· 主线 X" / "· Executive Summary" 等后缀）
    var numRaw = numEl ? numEl.textContent.trim() : '';
    var numMatch = numRaw.match(/§\d+/);
    var num = numMatch ? numMatch[0] : numRaw;
    // 标题：特殊节用 override、其他取 sec-title 按 ·/+/—/-/： 分隔的第 1 段
    var tit;
    if(TOC_OVERRIDE[sec.id]){
      tit = TOC_OVERRIDE[sec.id];
    } else {
      var titRaw = titEl ? titEl.textContent.replace(/\s+/g,' ').trim() : sec.id;
      tit = titRaw.split(/[·•—\-：:|+]/)[0].trim();
      if(!tit || tit.length < 2) tit = titRaw;
    }
    var a = document.createElement('a');
    a.href = '#' + sec.id;
    a.innerHTML = '<span class="n">'+num+'</span><span class="t">'+tit+'</span>';
    nav.appendChild(a);
  });
  document.body.insertBefore(nav, document.body.firstChild);

  // 收起 / 展开 目录
  var reopen = document.createElement('div');
  reopen.id = 'toc-reopen';
  reopen.title = '展开目录';
  reopen.textContent = '目录';
  document.body.appendChild(reopen);
  function setCollapsed(v){
    document.body.classList.toggle('toc-collapsed', v);
    try{ localStorage.setItem('wkTocCollapsed', v ? '1' : '0'); }catch(e){}
  }
  var cbtn = nav.querySelector('#toc-collapse');
  if(cbtn) cbtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); setCollapsed(true); });
  reopen.addEventListener('click', function(){ setCollapsed(false); });
  // 还原上次状态（无动画，避免加载闪烁）
  var saved; try{ saved = localStorage.getItem('wkTocCollapsed'); }catch(e){}
  if(saved === '1'){
    document.body.classList.add('toc-no-anim','toc-collapsed');
    requestAnimationFrame(function(){ document.body.classList.remove('toc-no-anim'); });
  }

  var links = Array.prototype.slice.call(nav.querySelectorAll('a'));
  var map = {};
  links.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
  // scroll-spy：当前章节 = 顶部已越过参考线(120px)的最后一个 section（对手动滚动与锚点跳转都稳定）
  var curId = null;
  function setActive(id){
    if(id === curId) return;
    curId = id;
    links.forEach(function(l){ l.classList.remove('active'); });
    var a = map[id];
    if(!a) return;
    a.classList.add('active');
    if(a.offsetTop < nav.scrollTop || a.offsetTop > nav.scrollTop + nav.clientHeight - 40){
      nav.scrollTop = a.offsetTop - nav.clientHeight/2;
    }
  }
  function onScroll(){
    var line = 120, current = secs[0].id;
    for(var i=0;i<secs.length;i++){
      if(secs[i].getBoundingClientRect().top <= line) current = secs[i].id;
      else break;
    }
    // 触底时强制点亮最后一节
    if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) current = secs[secs.length-1].id;
    setActive(current);
  }
  var ticking = false;
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(function(){ onScroll(); ticking = false; }); }
  }, {passive:true});
  onScroll();
})();
</script>
