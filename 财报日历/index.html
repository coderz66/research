<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F2ED;--navy:#1B2635;--amber:#B8870A;--amber-hi:#D4A017;
  --bull:#2D7A4F;--bear:#B23A48;--bull-bg:rgba(45,122,79,0.10);--bear-bg:rgba(178,58,72,0.10);
  --border:rgba(27,38,53,0.10);--muted:#6B7280;
}
body{background:var(--bg);color:var(--navy);font-family:'Karla',sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:1580px;margin:0 auto;padding:0 32px}

/* MASTHEAD */
.masthead{background:var(--navy);border-bottom:3px solid var(--amber);padding:48px 0 40px;position:relative;overflow:hidden}
.masthead::after{content:'EARNINGS';position:absolute;right:-8px;bottom:-30px;font-family:'Cormorant Garamond',serif;font-size:160px;font-weight:700;color:rgba(255,255,255,0.04);pointer-events:none;user-select:none}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.22em;color:var(--amber-hi);text-transform:uppercase;margin-bottom:14px}
.title{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:700;color:#fff;line-height:1.1;margin-bottom:14px}
.title em{color:#F5D67A;font-style:italic}
.desc{font-size:14px;font-weight:300;color:rgba(255,255,255,0.58);max-width:720px;margin-bottom:22px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 11px;border-radius:12px;background:rgba(255,255,255,0.08);color:#fff}
.pill.beat{background:rgba(45,122,79,0.25);color:#6fcf97}
.pill.miss{background:rgba(178,58,72,0.22);color:#eb8f9a}

/* FILTER BAR */
.filter-bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);z-index:20;padding:10px 0}
.filter-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:4px}
.filter-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--amber);margin-right:4px}
.fbtn{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--navy);cursor:pointer;border-radius:2px}
.fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.filter-sep{width:1px;height:20px;background:var(--border)}
.sector-sel{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 8px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:2px;cursor:pointer}
.tier-badge{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--amber);border:1px solid rgba(184,135,10,0.4);border-radius:2px;padding:0 3px;margin-left:5px}
.sector-tag{font-size:11.5px;color:var(--muted)}
.tag-beat{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;color:var(--bull);background:var(--bull-bg);padding:2px 6px;border-radius:2px}
.tag-miss{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;color:var(--bear);background:var(--bear-bg);padding:2px 6px;border-radius:2px}
tr.has-note{cursor:pointer}
tr.has-note:hover td{background:rgba(184,135,10,0.06)}
tr.has-note.expanded td{background:rgba(184,135,10,0.08)}
.note-star{color:var(--amber);font-size:11px}
.note-row td{padding:0;border-bottom:1px solid var(--border);white-space:normal}
.note-box{background:#FBFAF6;border-left:3px solid var(--amber);padding:14px 22px 16px;margin:0;font-size:11.5px;line-height:1.65;color:var(--navy)}
.note-box p{margin:0 0 9px}
.note-box p:last-child{margin-bottom:0}
.note-box .kicker{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:2px}
.note-box strong{color:var(--navy);font-weight:600}
.note-box em{font-style:italic}
.retbar{position:relative;display:flex;align-items:center;height:18px;min-width:56px}
.rb-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px}
.rb-fill.rb-pos{background:rgba(245,197,24,0.65)}
.rb-fill.rb-neg{background:rgba(178,58,72,0.32)}
.rb-val{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;padding-left:4px}
.rb-val.bull{color:var(--bull)}
.rb-val.bear{color:var(--bear)}

/* SUMMARY STRIP */
.summary-strip{display:flex;gap:32px;padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ss-item{display:flex;flex-direction:column;gap:3px}
.ss-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:var(--navy)}
.ss-num.bull{color:var(--bull)}
.ss-num.bear{color:var(--bear)}
.ss-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em}

/* TABLE */
.table-wrap{margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--navy);color:#fff;position:sticky;top:44px;z-index:10}
th{padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:rgba(255,255,255,0.07)}
th .sort-arrow{opacity:0.35;margin-left:4px}
th.sort-asc .sort-arrow::after{content:'↑';opacity:1}
th.sort-desc .sort-arrow::after{content:'↓';opacity:1}
th:not(.sort-asc):not(.sort-desc) .sort-arrow::after{content:'↕'}
td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td.mono{font-family:'JetBrains Mono',monospace}
td.bull{color:var(--bull)}
td.bear{color:var(--bear)}
td.beat-cell{background:var(--bull-bg);color:var(--bull);font-family:'JetBrains Mono',monospace;font-weight:500}
td.miss-cell{background:var(--bear-bg);color:var(--bear);font-family:'JetBrains Mono',monospace;font-weight:500}
tr:hover td{background:rgba(27,38,53,0.03)}
tr:hover td.beat-cell{background:rgba(45,122,79,0.16)}
tr:hover td.miss-cell{background:rgba(178,58,72,0.16)}
.na{color:var(--muted);font-style:italic}

/* EMPTY */
.empty-msg{text-align:center;padding:60px;color:var(--muted);font-size:14px;display:none}

/* COUNT */
.result-count{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);padding:10px 0 6px;letter-spacing:0.05em}
</style>
</head>

<div class="wrap" style="padding-bottom:80px">

</div>

ad-through · 弹性差序</span>核心矛盾是 AI 在创意软件里同时是 ADBE 的武器和威胁。<em>direct</em> 竞争：<strong>FIGMA</strong>（设计协作，IPO 在即，估值锚对照）、<strong>Canva</strong>（私有，下沉+AI 生成挤压 Express）；生成式底层的 <em>Midjourney/OpenAI</em> 图像能力是「绕过 Adobe 工作流」的最大长期变量。横向 read-through 到 <strong>CRM</strong>——同为「AI 替代叙事压估值」的 SaaS 龙头，ADBE 财报后市场把同套质疑加到 CRM 头上，属 <em>sentiment</em> 映射而非业务直连。上游算力受益微弱，ADBE 的 AI 推理成本不构成对 NVDA 的 material 拉动。</p><p><span class='kicker'>关键观察点</span>下季看三个变量：<strong>① CEO 落定时点与人选</strong>——内部 David Wadhwani / Anil Chakravarthy vs 外部，决定治理折价能否修复；<strong>② AI-first ARR 净增结构</strong>——new logo vs 存量迁移占比，是货币化质量硬证据；<strong>③ Firefly 单价与用量曲线</strong>——能否从「附加功能」变成「独立付费层」。产业级前瞻：盯 FIGMA IPO 定价，它是市场给「AI 原生设计工具」的估值标尺，直接反推愿给 ADBE 的护城河折价。</p>"},{"sym":"CASY","name":"Casey's General Stores, Inc.","mcap":33.31,"tier":"L2","sector":"Consumer Cyclical","date":"2026-06-09","eps_a":4.37,"eps_e":3.31,"rev_a":4571779000,"rev_e":4326402000,"r_tm1":-1.3,"r_t0":1.3,"r_tp1":20.3,"note":"<p><span class='kicker'>预期差 · 分项驱动</span>FY26Q4 全线碾压：EPS <strong>$4.37</strong> vs $3.31（beat 32%、+66% YoY），net income +65.5% 至 <strong>$162.7M</strong>、EBITDA +33%。两大引擎结构性走强：<em>燃油毛利</em> <strong>46.9 美分/加仑</strong>、燃油 gross profit <strong>+29.1%</strong>；inside same-store <strong>+5.5%</strong>、inside margin <strong>42.4%</strong>、inside 收入 +7.4% 破 $1.5B。燃油高 spread 含行业 beta，但 inside 的高毛利 prepared food 占比提升+<em>CEFCO</em> 规模效应是 Casey's 自身 alpha。</p><p><span class='kicker'>市场 price in 了什么</span>事件前共识：连续四季 beat，市场已预期 inside SSS 稳健，但对燃油毛利持「均值回归、不可持续」保守假设。重定价两层：<strong>① 燃油毛利持续性被上修</strong>——46.9 美分/加仑兑现「结构性而非周期顶」叙事，市场把燃油从「拖累项」重估为「稳定现金来源」；<strong>② CEFCO 整合超预期</strong>——remodel 进度好于预期、FY26 收尾 2,944 店，把外延并购从「整合风险」重估为「可复制增长引擎」。T+1 <strong>+20.3%</strong> 是对「inside+燃油+并购」三引擎同时验证的 re-rating。FY27 指引 EBITDA +8-10%（从 FY26 +18-20% 降档）是高基数 normalize，市场没当利空。</p><p><span class='kicker'>产业链 read-through · 弹性差序</span>便利店+燃油零售是窄链，read-through 集中直接同业：<em>direct</em> 龙头 <strong>ATD</strong>（Couche-Tard，北美便利店最大整合者，CASY 的 inside margin 标杆与并购对手）、<strong>MUSA</strong>（Murphy USA，纯燃油零售、对燃油 spread 弹性最高的对照）。CASY 燃油毛利 46.9 美分若代表行业 spread 抬升，MUSA 是最直接 read-through。上游对炼厂/批发端（<em>indirect</em>）影响有限——零售毛利扩张更多来自下游定价权。食品供应链端 prepared food 放量是温和增量，无 material 单一受益标的。这是「自身经营质量 > 产业传导」的链。</p><p><span class='kicker'>关键观察点</span>FY27 看四个变量：<strong>① 燃油毛利能否守住 40+ 美分/加仑</strong>——市场重估核心假设，跌破则逻辑松动；<strong>② inside SSS 兑现 +2-5% 指引下沿还是上沿</strong>，prepared food 占比能否继续推高 inside margin（当前 42.4%）；<strong>③ CEFCO 全面转制完成度</strong>——FY27 计划 $800M capex 主投于此；<strong>④ 新建+并购店数</strong>节奏。产业级前瞻：盯全美零售燃油 spread 月度数据，与 MUSA 同步验证燃油毛利是结构性抬升还是周期顶。</p>"},{"sym":"LEN","name":"Lennar Corporation","mcap":22.42,"tier":"L3","sector":"Consumer Cyclical","date":"2026-06-11","eps_a":1.24,"eps_e":1.24,"rev_a":7939872000,"rev_e":8084866000,"r_tm1":-2.9,"r_t0":5.7,"r_tp1":-4.9,"note":null},{"sym":"SJM","name":"The J. M. Smucker Company","mcap":12.46,"tier":"L3","sector":"Consumer Defensive","date":"2026-06-09","eps_a":2.77,"eps_e":2.64,"rev_a":2268100000,"rev_e":2257653000,"r_tm1":-1.7,"r_t0":10.4,"r_tp1":4.1,"note":null},{"sym":"CNM","name":"Core & Main, Inc.","mcap":9.05,"tier":"L3","sector":"Industrials","date":"2026-06-10","eps_a":0.57,"eps_e":0.534,"rev_a":1910000000,"rev_e":1894811000,"r_tm1":0.9,"r_t0":-6.1,"r_tp1":1.3,"note":null},{"sym":"SAIL","name":"SailPoint, Inc.","mcap":8.18,"tier":"L3","sector":"Technology","date":"2026-06-09","eps_a":0.05,"eps_e":0.04328,"rev_a":280142000,"rev_e":275751000,"r_tm1":-3.0,"r_t0":-11.5,"r_tp1":-6.1,"note":null},{"sym":"CHWY","name":"Chewy, Inc.","mcap":8,"tier":"L3","sector":"Consumer Cyclical","date":"2026-06-10","eps_a":0.23,"eps_e":0.2436,"rev_a":3357200000,"rev_e":3350659000,"r_tm1":1.2,"r_t0":-2.1,"r_tp1":-6.1,"note":null},{"sym":"VFS","name":"VinFast Auto Ltd.","mcap":7.37,"tier":"L3","sector":"Consumer Cyclical","date":"2026-06-08","eps_a":-0.48,"eps_e":-0.355,"rev_a":920685700,"rev_e":1010500000,"r_tm1":-3.6,"r_t0":-5.0,"r_tp1":-0.3,"note":null},{"sym":"CPB","name":"Campbell Soup Company","mcap":6.82,"tier":"L3", <script>
const fmtRev = v => {
  if (v == null || v === 0) return null;
  if (Math.abs(v) >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
  if (Math.abs(v) >= 1e6) return '$' + Math.round(v/1e6) + 'M';
  return '$' + Math.round(v/1e3) + 'K';
};
const fmtEps = v => v == null ? null : (v >= 0 ? '' : '') + v.toFixed(2);
const fmtMcap = v => {
  if (v == null) return '<span class="na">—</span>';
  if (v >= 1000) return '$' + (v/1000).toFixed(2) + 'T';
  return '$' + (v >= 100 ? Math.round(v) : v.toFixed(1)) + 'B';
};
const fmtRet = v => {
  if (v == null) return '<span class="na">—</span>';
  const w = Math.min(Math.abs(v), 30) / 30 * 100;   // |涨跌| 满格 30%
  const dir = v >= 0 ? 'pos' : 'neg';
  return `<div class="retbar"><span class="rb-fill rb-${dir}" style="width:${w.toFixed(0)}%"></span><span class="rb-val ${v >= 0 ? 'bull' : 'bear'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span></div>`;
};
const resultTag = ep => ep == null
  ? '<span class="na">—</span>'
  : (ep >= 0 ? '<span class="tag-beat">BEAT</span>' : '<span class="tag-miss">MISS</span>');
const pct = (a, e) => {
  if (a == null || e == null || e === 0) return null;
  return (a - e) / Math.abs(e) * 100;
};

let allData = [];
let weeks = [];
let curWeek = null;
let sortCol = 'mcap';
let sortDir = -1; // -1 = desc
let filters = { date: 'all', tier: 'all', sector: 'all', result: 'all' };

const DOW = ['日','一','二','三','四','五','六'];
const SECTOR_CN = {
  'Technology':'科技','Financial Services':'金融','Healthcare':'医疗',
  'Industrials':'工业','Consumer Cyclical':'可选消费','Energy':'能源',
  'Real Estate':'地产','Basic Materials':'材料','Communication Services':'通讯',
  'Consumer Defensive':'必需消费','Utilities':'公用事业'
};

// 数据来源：优先用内联 window.__CAIBAO__（self-contained，双击 file:// 也能看）；
// 没有内联（如开发态/手删了）则回退 fetch data/*.json（需通过 http server 访问）
const EMBED = (typeof window !== 'undefined' && window.__CAIBAO__) ? window.__CAIBAO__ : null;

if (EMBED) {
  weeks = (EMBED.index && EMBED.index.weeks) || [];
  buildWeekButtons();
  if (weeks.length) loadWeek(weeks[0].week);
} else {
  fetch('./data/index.json')
    .then(r => r.json())
    .then(idx => {
      weeks = idx.weeks || [];
      if (!weeks.length) throw new Error('no weeks');
      buildWeekButtons();
      loadWeek(weeks[0].week);
    })
    .catch(() => {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="15" style="text-align:center;padding:40px;color:var(--muted)">数据加载失败：请通过本地 server 打开，或重跑 fetch_earnings.py 重新生成内联数据</td></tr>';
    });
}

function buildWeekButtons() {
  document.getElementById('fg-week').innerHTML = weeks.map((w, i) =>
    `<button class="fbtn${i === 0 ? ' active' : ''}" data-week="${w.week}">${w.week.slice(5)} · ${w.from.slice(5)}</button>`
  ).join('');
}

function loadWeek(wk) {
  curWeek = wk;
  if (EMBED) { applyWeek(EMBED.weeks[wk]); return; }
  fetch(`./data/${wk}.json`).then(r => r.json()).then(applyWeek);
}

function applyWeek(d) {
  allData = d.records.map(r => ({
    ...r,
    eps_pct: pct(r.eps_a, r.eps_e),
    rev_pct: pct(r.rev_a, r.rev_e),
  }));
  filters.date = 'all';
  filters.tier = 'all';
  filters.sector = 'all';
  buildDateButtons(d.from, d.to);
  buildSectorOptions();
  resetTierActive();
  updateHeader(d);
  updateSummary(allData);
  render();
}

function updateHeader(d) {
  document.getElementById('eyebrow').textContent = `EARNINGS CALENDAR · ${d.week} · ${d.from} – ${d.to}`;
  document.getElementById('desc').textContent = `FMP earnings calendar — ${d.count} 家本周已报财报（含 EPS 实际值）。按日期、规模、结果筛选。`;
}

function buildDateButtons(from, to) {
  const btns = ['<button class="fbtn active" data-date="all">All</button>'];
  const cur = new Date(from + 'T00:00:00Z');
  const end = new Date(to + 'T00:00:00Z');
  while (cur <= end) {
    const iso = cur.toISOString().slice(0, 10);
    btns.push(`<button class="fbtn" data-date="${iso}">周${DOW[cur.getUTCDay()]} ${iso.slice(5)}</button>`);
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  document.getElementById('fg-date').innerHTML = btns.join('');
}

function buildSectorOptions() {
  const secs = [...new Set(allData.map(r => r.sector).filter(Boolean))].sort();
  const sel = document.getElementById('sector-sel');
  sel.innerHTML = '<option value="all">全部行业</option>' +
    secs.map(s => `<option value="${s}">${SECTOR_CN[s] || s}</option>`).join('');
  sel.value = 'all';
}

function resetTierActive() {
  document.querySelectorAll('#fg-tier .fbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.tier === 'all'));
}

function updateSummary(data) {
  const withEst = data.filter(r => r.eps_pct != null);
  const beats = withEst.filter(r => r.eps_pct >= 0);
  const misses = withEst.filter(r => r.eps_pct < 0);
  const rate = withEst.length ? Math.round(beats.length / withEst.length * 100) : 0;
  const pcts = withEst.map(r => r.eps_pct).sort((a,b) => a-b);
  const median = pcts.length ? pcts[Math.floor(pcts.length/2)].toFixed(1) : '—';

  document.getElementById('pill-total').textContent = `${data.length} 家已报`;
  document.getElementById('pill-beat').textContent = `Beat ${beats.length}`;
  document.getElementById('pill-miss').textContent = `Miss ${misses.length}`;
  document.getElementById('pill-rate').textContent = `Beat Rate ${rate}%`;
  document.getElementById('ss-total').textContent = data.length;
  document.getElementById('ss-beat').textContent = beats.length;
  document.getElementById('ss-miss').textContent = misses.length;
  document.getElementById('ss-rate').textContent = rate + '%';
  document.getElementById('ss-median').textContent = (median > 0 ? '+' : '') + median + '%';
}

function filtered() {
  return allData.filter(r => {
    if (filters.date !== 'all' && r.date !== filters.date) return false;
    if (filters.tier !== 'all' && r.tier !== filters.tier) return false;
    if (filters.sector !== 'all' && r.sector !== filters.sector) return false;
    if (filters.result === 'beat' && (r.eps_pct == null || r.eps_pct < 0)) return false;
    if (filters.result === 'miss' && (r.eps_pct == null || r.eps_pct >= 0)) return false;
    if (filters.result === 'na' && r.eps_pct != null) return false;
    return true;
  });
}

function render() {
  const rows = filtered().slice().sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    const nullV = sortDir === -1 ? -Infinity : Infinity;   // null 永远垫底
    if (av == null) av = (typeof bv === 'string') ? '￿' : nullV;
    if (bv == null) bv = (typeof av === 'string') ? '￿' : nullV;
    const cmp = (typeof av === 'string') ? av.localeCompare(bv) : (av - bv);
    return sortDir === -1 ? -cmp : cmp;   // -1=desc，与表头箭头一致
  });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty-msg');
  document.getElementById('result-count').textContent = `显示 ${rows.length} 条 / 共 ${allData.length} 条`;

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const epPct = r.eps_pct;
    const rvPct = r.rev_pct;
    const epCell = epPct == null
      ? `<td class="na">N/A</td>`
      : `<td class="${epPct >= 0 ? 'beat-cell' : 'miss-cell'}">${epPct >= 0 ? '+' : ''}${epPct.toFixed(1)}%</td>`;
    const rvCell = rvPct == null
      ? `<td class="na">—</td>`
      : `<td class="mono ${rvPct >= 0 ? 'bull' : 'bear'}">${rvPct >= 0 ? '+' : ''}${rvPct.toFixed(1)}%</td>`;
    return `<tr class="${r.note ? 'has-note' : ''}">
      <td class="mono">${r.date}</td>
      <td class="mono" style="font-weight:500">${r.sym}${r.note ? ' <span class="note-star">★</span>' : ''}</td>
      <td>${r.name ?? '<span class="na">—</span>'}</td>
      <td><span class="sector-tag">${SECTOR_CN[r.sector] || r.sector || '—'}</span></td>
      <td class="mono">${fmtMcap(r.mcap)}${r.tier ? ` <span class="tier-badge">${r.tier}</span>` : ''}</td>
      <td class="mono">${fmtEps(r.eps_a) ?? '<span class="na">—</span>'}</td>
      <td class="mono">${fmtEps(r.eps_e) ?? '<span class="na">—</span>'}</td>
      ${epCell}
      <td>${resultTag(epPct)}</td>
      <td class="mono">${fmtRev(r.rev_a) ?? '<span class="na">—</span>'}</td>
      <td class="mono">${fmtRev(r.rev_e) ?? '<span class="na">—</span>'}</td>
      ${rvCell}
      <td class="mono">${fmtRet(r.r_tm1)}</td>
      <td class="mono">${fmtRet(r.r_t0)}</td>
      <td class="mono">${fmtRet(r.r_tp1)}</td>
    </tr>${r.note ? `<tr class="note-row" style="display:none"><td colspan="15"><div class="note-box">${r.note}</div></td></tr>` : ''}`;
  }).join('');
}

// Filter buttons（fg-week / fg-date 按钮动态生成，靠容器事件委托）
['fg-week','fg-date','fg-tier','fg-result'].forEach(gid => {
  document.getElementById(gid).addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    [...btn.parentElement.querySelectorAll('.fbtn')].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (gid === 'fg-week') { loadWeek(btn.dataset.week); return; }  // 切周 = 重新载入
    if (gid === 'fg-date') filters.date = btn.dataset.date;
    if (gid === 'fg-tier') filters.tier = btn.dataset.tier;
    if (gid === 'fg-result') filters.result = btn.dataset.result;
    render();
  });
});

// 行业下拉
document.getElementById('sector-sel').addEventListener('change', e => {
  filters.sector = e.target.value;
  render();
});

// 点击有点评的行 → 展开/收起下方点评
document.getElementById('tbody').addEventListener('click', e => {
  const tr = e.target.closest('tr.has-note');
  if (!tr) return;
  const nr = tr.nextElementSibling;
  if (nr && nr.classList.contains('note-row')) {
    const show = nr.style.display === 'none';
    nr.style.display = show ? '' : 'none';
    tr.classList.toggle('expanded', show);
  }
});

// Sort
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortDir *= -1; }
    else { sortCol = col; sortDir = -1; }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(sortDir === -1 ? 'sort-desc' : 'sort-asc');
    render();
  });
});
</script>
</body>
</html>
