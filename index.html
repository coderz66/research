<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Research Reports — coderz66</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Karla:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1B2635;
    --amber: #B8870A;
    --amber-hi: #D4A017;
    --bg: #F4F2ED;
    --muted: #6B7280;
    --border: #DDD8CF;
  }

  body {
    background: var(--bg);
    color: var(--navy);
    font-family: 'Karla', sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── MASTHEAD ── */
  .masthead {
    background: var(--navy);
    border-bottom: 3px solid var(--amber);
    position: relative;
    overflow: hidden;
    padding: 48px 0 40px;
  }

  .masthead::after {
    content: 'RESEARCH';
    position: absolute;
    right: -10px;
    bottom: -30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 160px;
    font-weight: 700;
    color: rgba(255,255,255,0.04);
    letter-spacing: -4px;
    pointer-events: none;
    user-select: none;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 40px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .masthead h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 14px;
  }

  .masthead h1 em {
    color: var(--amber-hi);
    font-style: italic;
  }

  .masthead p {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    font-weight: 300;
    max-width: 540px;
  }

  /* ── FILTER PILLS ── */
  .filter-bar {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .filter-bar .wrap {
    display: flex;
    gap: 8px;
    padding-top: 14px;
    padding-bottom: 14px;
  }

  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    user-select: none;
  }

  .pill:hover { border-color: var(--amber); color: var(--amber); }
  .pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ── MAIN CONTENT ── */
  .main { padding: 48px 0 80px; }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 6px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .s-divider {
    width: 44px;
    height: 2px;
    background: var(--amber);
    margin: 12px 0 28px;
  }

  /* ── REPORT CARDS ── */
  .report-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .report-card {
    display: flex;
    align-items: stretch;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, transform 0.1s;
  }

  .report-card:hover {
    box-shadow: 0 4px 20px rgba(27,38,53,0.10);
    transform: translateY(-1px);
  }

  .card-accent {
    width: 4px;
    flex-shrink: 0;
  }

  .card-accent.us-weekly { background: #2563EB; }
  .card-accent.a-share   { background: #DC2626; }
  .card-accent.macro     { background: var(--amber); }

  .card-body {
    padding: 20px 24px;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .card-meta {
    flex: 1;
  }

  .card-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  .card-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    text-align: right;
  }

  .card-arrow {
    font-size: 18px;
    color: var(--border);
    margin-left: 8px;
    transition: color 0.15s;
  }

  .report-card:hover .card-arrow { color: var(--amber); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-size: 14px;
    display: none;
  }

  /* ── STATS BAR ── */
  .stats {
    display: flex;
    gap: 32px;
    margin-bottom: 32px;
    padding: 18px 24px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .stat-item { display: flex; flex-direction: column; gap: 2px; }

  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── FILTER JS ── */
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="eyebrow">Independent Research · Multi-Asset</div>
    <h1>Research <em>Reports</em></h1>
    <p>美股 · A股 · 宏观 — 主动管理视角下的投研输出</p>
  </div>
</header>

<nav class="filter-bar">
  <div class="wrap">
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="us-weekly">US Weekly</button>
    <button class="pill" data-filter="a-share">A股研究</button>
    <button class="pill" data-filter="macro">宏观</button>
  </div>
</nav>

<main class="main">
  <div class="wrap">

    <div class="stats">
      <div class="stat-item">
        <span class="stat-num" id="total-count">1</span>
        <span class="stat-label">Total Reports</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">2026</span>
        <span class="stat-label">Coverage Year</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">US · CN</span>
        <span class="stat-label">Markets</span>
      </div>
    </div>

    <div class="section-label">Archive</div>
    <div class="section-title">所有报告</div>
    <div class="s-divider"></div>

    <div class="report-grid" id="report-grid">

      <!-- US Weekly 260509 -->
      <a href="US weekly/美股周报_260509.html" class="report-card" data-category="us-weekly">
        <div class="card-accent us-weekly"></div>
        <div class="card-body">
          <div class="card-meta">
            <div class="card-type">US Weekly · 美股周报</div>
            <div class="card-title">美股周报 — 2026-05-09</div>
            <div class="card-desc">NDX / SPX 周度归因 · 异动筛选 · 主题供应链健康度</div>
          </div>
          <div class="card-date">
            2026-05-09<br>
            <span style="color:var(--border)">W19</span>
          </div>
          <span class="card-arrow">→</span>
        </div>
      </a>

    </div>

    <div class="empty" id="empty-state">该分类下暂无报告</div>

  </div>
</main>

<script>
  const pills = document.querySelectorAll('.pill');
  const cards = document.querySelectorAll('.report-card');
  const counter = document.getElementById('total-count');
  const empty = document.getElementById('empty-state');

  pills.forEach(pill => {
    pill.addEventListener('click', () => {
      pills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const filter = pill.dataset.filter;
      let visible = 0;
      cards.forEach(card => {
        const match = filter === 'all' || card.dataset.category === filter;
        card.style.display = match ? 'flex' : 'none';
        if (match) visible++;
      });
      counter.textContent = visible;
      empty.style.display = visible === 0 ? 'block' : 'none';
    });
  });
</script>

</body>
</html>
